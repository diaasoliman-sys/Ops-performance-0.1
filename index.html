<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Operations Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      font-family:Arial;
      background:#f5f6fa;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .card h3{
      color:gray;
      margin-bottom:10px;
    }

    .card h1{
      font-size:35px;
    }

    .charts{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:20px;
    }

    .chart-box{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background:white;
      border-radius:15px;
      overflow:hidden;
    }

    th,td{
      padding:14px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    th{
      background:#f1f5f9;
    }

  </style>

</head>

<body>

<h1>Operations Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>Total Employees</h3>
    <h1 id="employees">0</h1>
  </div>

  <div class="card">
    <h3>Site Employees</h3>
    <h1 id="onsite">0</h1>
  </div>

  <div class="card">
    <h3>Average Productivity</h3>
    <h1 id="productivity">0%</h1>
  </div>

  <div class="card">
    <h3>Average Utilization</h3>
    <h1 id="utilization">0%</h1>
  </div>

</div>

<div class="charts">

  <div class="chart-box">
    <canvas id="statusChart"></canvas>
  </div>

  <div class="chart-box">
    <canvas id="accountChart"></canvas>
  </div>

</div>

<table>

  <thead>
    <tr>
      <th>Agent</th>
      <th>Account</th>
      <th>Productivity</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>

</table>

<script>

const SHEET_URL =
"https://opensheet.elk.sh/1GfybYgbwlbIev0yxei_PW8pRNd7yRWhuwA-3ZNBfHp0/Attendance";

async function loadDashboard(){

  try{

    const response = await fetch(SHEET_URL);

    const data = await response.json();

    console.log(data);

    /*
    ==========================
    CLEAN %
    ==========================
    */

    const clean = (value) => {

      if(!value) return 0;

      return parseFloat(
        value.toString().replace("%","")
      ) || 0;

    };

    /*
    ==========================
    KPI
    ==========================
    */

    const employees = data.length;

    const onsite = data.filter(
      x => x.Status &&
      x.Status.toLowerCase().includes("site")
    ).length;

    const avgProductivity =
      data.reduce(
        (sum,row)=>sum + clean(row.Productivity),
        0
      ) / employees;

    const avgUtilization =
      data.reduce(
        (sum,row)=>sum + clean(row.Utilization),
        0
      ) / employees;

    document.getElementById("employees").innerText =
      employees;

    document.getElementById("onsite").innerText =
      onsite;

    document.getElementById("productivity").innerText =
      avgProductivity.toFixed(1) + "%";

    document.getElementById("utilization").innerText =
      avgUtilization.toFixed(1) + "%";

    /*
    ==========================
    STATUS CHART
    ==========================
    */

    const statusCounts = {};

    data.forEach(row=>{

      const status = row.Status || "Unknown";

      if(!statusCounts[status]){
        statusCounts[status] = 0;
      }

      statusCounts[status]++;

    });

    new Chart(
      document.getElementById("statusChart"),
      {
        type:"bar",

        data:{
          labels:Object.keys(statusCounts),

          datasets:[{
            label:"Employees",
            data:Object.values(statusCounts)
          }]
        }
      }
    );

    /*
    ==========================
    ACCOUNT CHART
    ==========================
    */

    const accountCounts = {};

    data.forEach(row=>{

      const account = row.Account || "Unknown";

      if(!accountCounts[account]){
        accountCounts[account] = 0;
      }

      accountCounts[account]++;

    });

    new Chart(
      document.getElementById("accountChart"),
      {
        type:"pie",

        data:{
          labels:Object.keys(accountCounts),

          datasets:[{
            data:Object.values(accountCounts)
          }]
        }
      }
    );

    /*
    ==========================
    TABLE
    ==========================
    */

    const table =
      document.getElementById("tableBody");

    table.innerHTML = "";

    data.slice(0,20).forEach(row=>{

      table.innerHTML += `

        <tr>
          <td>${row.Name || ""}</td>
          <td>${row.Account || ""}</td>
          <td>${row.Productivity || ""}</td>
          <td>${row.Status || ""}</td>
        </tr>

      `;

    });

  }

  catch(error){

    console.error(error);

    document.body.innerHTML += `
      <h2 style="color:red">
        Error Loading Dashboard
      </h2>
    `;

  }

}

loadDashboard();

</script>

</body>
</html>
