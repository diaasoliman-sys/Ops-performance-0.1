<!DOCTYPE html>
<html>

<head>

  <title>Operations Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      font-family:Arial;
      background:#f5f6fa;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .card h3{
      color:gray;
      margin-bottom:10px;
    }

    .card h1{
      font-size:35px;
    }

    .charts{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:20px;
    }

    .chart-box{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      margin-top:30px;
    }

    th,td{
      padding:14px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    th{
      background:#f1f5f9;
    }

  </style>

</head>

<body>

<h1>Operations Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>Total Employees</h3>
    <h1 id="employees">0</h1>
  </div>

  <div class="card">
    <h3>Site Employees</h3>
    <h1 id="onsite">0</h1>
  </div>

  <div class="card">
    <h3>Average Productivity</h3>
    <h1 id="productivity">0%</h1>
  </div>

  <div class="card">
    <h3>Average Utilization</h3>
    <h1 id="utilization">0%</h1>
  </div>

</div>

<div class="charts">

  <div class="chart-box">
    <canvas id="statusChart"></canvas>
  </div>

  <div class="chart-box">
    <canvas id="accountChart"></canvas>
  </div>

</div>

<table>

  <thead>

    <tr>
      <th>Name</th>
      <th>Account</th>
      <th>Productivity</th>
      <th>Status</th>
    </tr>

  </thead>

  <tbody id="tableBody"></tbody>

</table>

<script>

const SHEET_ID =
"1GfybYgbwlbIev0yxei_PW8pRNd7yRWhuwA-3ZNBfHp0";

/*
========================================
GOOGLE SHEET JSON
========================================
*/

const URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Attendance`;

async function loadDashboard(){

  try{

    const response =
      await fetch(URL);

    const text =
      await response.text();

    /*
    ========================================
    CLEAN GOOGLE RESPONSE
    ========================================
    */

    const json =
      JSON.parse(
        text.substring(47).slice(0,-2)
      );

    const rows =
      json.table.rows;

    /*
    ========================================
    CONVERT TO OBJECTS
    ========================================
    */

    const data =
      rows.map(row => ({

        Code:
          row.c[0]?.v || "",

        Name:
          row.c[1]?.v || "",

        Account:
          row.c[2]?.v || "",

        TeamLeader:
          row.c[3]?.v || "",

        Date:
          row.c[4]?.v || "",

        Status:
          row.c[5]?.v || "",

        Productivity:
          row.c[6]?.v || "0%",

        Utilization:
          row.c[7]?.v || "0%",

        Occupancy:
          row.c[8]?.v || "0%"

      }));

    console.log(data);

    /*
    ========================================
    CLEAN %
    ========================================
    */

    const clean = (value) => {

      if(!value) return 0;

      return parseFloat(
        value.toString().replace("%","")
      ) || 0;

    };

    /*
    ========================================
    KPI
    ========================================
    */

    document.getElementById("employees").innerText =
      data.length;

    const onsite =
      data.filter(
        x => x.Status.includes("Site")
      ).length;

    document.getElementById("onsite").innerText =
      onsite;

    const avgProd =
      data.reduce(
        (sum,row)=>sum + clean(row.Productivity),
        0
      ) / data.length;

    document.getElementById("productivity").innerText =
      avgProd.toFixed(1) + "%";

    const avgUtil =
      data.reduce(
        (sum,row)=>sum + clean(row.Utilization),
        0
      ) / data.length;

    document.getElementById("utilization").innerText =
      avgUtil.toFixed(1) + "%";

    /*
    ========================================
    STATUS CHART
    ========================================
    */

    const statusCount = {};

    data.forEach(row => {

      const status =
        row.Status || "Unknown";

      if(!statusCount[status]){

        statusCount[status] = 0;

      }

      statusCount[status]++;

    });

    new Chart(
      document.getElementById("statusChart"),
      {
        type:"bar",

        data:{
          labels:Object.keys(statusCount),

          datasets:[{
            label:"Employees",
            data:Object.values(statusCount)
          }]
        }
      }
    );

    /*
    ========================================
    ACCOUNT CHART
    ========================================
    */

    const accountCount = {};

    data.forEach(row => {

      const account =
        row.Account || "Unknown";

      if(!accountCount[account]){

        accountCount[account] = 0;

      }

      accountCount[account]++;

    });

    new Chart(
      document.getElementById("accountChart"),
      {
        type:"pie",

        data:{
          labels:Object.keys(accountCount),

          datasets:[{
            data:Object.values(accountCount)
          }]
        }
      }
    );

    /*
    ========================================
    TABLE
    ========================================
    */

    const table =
      document.getElementById("tableBody");

    table.innerHTML = "";

    data.slice(0,20).forEach(row => {

      table.innerHTML += `

        <tr>
          <td>${row.Name}</td>
          <td>${row.Account}</td>
          <td>${row.Productivity}</td>
          <td>${row.Status}</td>
        </tr>

      `;

    });

  }

  catch(error){

    console.error(error);

    alert("ERROR CHECK CONSOLE");

  }

}

loadDashboard();

</script>

</body>
</html>
