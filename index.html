<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ops Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1e293b; }
    header { background: #1e3a5f; color: white; padding: 18px 32px; font-size: 1.3rem; font-weight: 600; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }

    .filters { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .filters label { font-size: 0.8rem; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .filters select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; font-size: 0.9rem; color: #1e293b; min-width: 160px; cursor: pointer; }
    .filters select:focus { outline: none; border-color: #3b82f6; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border-left: 4px solid #3b82f6; }
    .kpi-card:nth-child(2) { border-left-color: #10b981; }
    .kpi-card:nth-child(3) { border-left-color: #f59e0b; }
    .kpi-card:nth-child(4) { border-left-color: #6366f1; }
    .kpi-card:nth-child(5) { border-left-color: #ec4899; }
    .kpi-label { font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-value { font-size: 1.8rem; font-weight: 700; color: #1e293b; }

    .chart-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 24px; }
    .chart-card h2 { font-size: 1rem; font-weight: 600; color: #475569; margin-bottom: 16px; }
    canvas { max-height: 300px; }

    .table-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow-x: auto; }
    .table-card h2 { font-size: 1rem; font-weight: 600; color: #475569; margin-bottom: 16px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th { background: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding: 10px 14px; text-align: left; border-bottom: 2px solid #e2e8f0; }
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 10px 14px; color: #334155; }

    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
    .status-site   { background: #dbeafe; color: #1d4ed8; }
    .status-remote { background: #d1fae5; color: #065f46; }
    .status-other  { background: #fef3c7; color: #92400e; }

    .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 0.875rem; color: #64748b; }
    .pagination button { padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; cursor: pointer; font-size: 0.875rem; }
    .pagination button:hover { background: #f1f5f9; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    #loading { text-align: center; padding: 60px; color: #94a3b8; font-size: 1rem; }
  </style>
</head>
<body>

<header>📊 Ops Performance Dashboard</header>

<div class="container">

  <div class="filters">
    <div>
      <label for="accountFilter">Account</label>
      <select id="accountFilter"><option value="All">All</option></select>
    </div>
    <div>
      <label for="monthFilter">Month</label>
      <select id="monthFilter"><option value="All">All</option></select>
    </div>
    <div>
      <label for="weekFilter">Week</label>
      <select id="weekFilter"><option value="All">All</option></select>
    </div>
    <div>
      <label for="weekMonthFilter">Week of Month</label>
      <select id="weekMonthFilter"><option value="All">All</option></select>
    </div>
    <div>
      <label for="dateFilter">Date</label>
      <select id="dateFilter"><option value="All">All</option></select>
    </div>
    <div>
      <label for="codeFilter">Employee Code</label>
      <select id="codeFilter"><option value="All">All</option></select>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">On-Site Rate</div><div class="kpi-value" id="onsiteRate">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Remote Rate</div><div class="kpi-value" id="remoteRate">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg Productivity</div><div class="kpi-value" id="avgProductivity">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg Utilization</div><div class="kpi-value" id="avgUtilization">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg Occupancy</div><div class="kpi-value" id="avgOccupancy">—</div></div>
  </div>

  <div class="chart-card">
    <h2>Weekly Attendance — Site vs Remote</h2>
    <canvas id="weeklyChart"></canvas>
  </div>

  <div class="table-card">
    <h2>Employee Records</h2>
    <div id="loading">Loading data...</div>
    <table id="dataTable" style="display:none;">
      <thead>
        <tr>
          <th>Code</th><th>Name</th><th>Account</th><th>Team Leader</th>
          <th>Status</th><th>Week</th><th>Productivity</th><th>Utilization</th><th>Occupancy</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="pagination" id="pagination" style="display:none;">
      <span id="pageInfo"></span>
      <div>
        <button id="prevBtn" onclick="changePage(-1)">← Prev</button>
        &nbsp;
        <button id="nextBtn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>

</div>

<script>
  const SHEET_ID   = "1GfybYgbwlbIev0yxei_PW8pRNd7yRWhuwA-3ZNBfHp0";
  const SHEET_NAME = "Attendance";
  const GVIZ_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
  const PAGE_SIZE  = 100;

  let fullData     = [];
  let filteredData = [];
  let currentPage  = 1;
  let weeklyChart  = null;

  const isLeave = status => !status.includes("active");

  /* ---------- LOAD ---------- */
  async function loadData() {
    try {
      const response = await fetch(GVIZ_URL);
      const text     = await response.text();

      const start = text.indexOf('{');
      const end   = text.lastIndexOf('}');
      const json  = JSON.parse(text.substring(start, end + 1));
      const rows  = json.table.rows || [];

      const parsePercent = val => {
        if (val == null) return null;
        const num = parseFloat(val.toString().replace("%", ""));
        if (isNaN(num)) return null;
        return num <= 1 ? num * 100 : num;
      };

      fullData = rows.map(row => {
        const c = row.c || [];

        let dateVal = "";
        const dv = c[4]?.v;
        if (dv && typeof dv === "string" && dv.startsWith("Date(")) {
          const p = dv.replace("Date(","").replace(")","").split(",");
          dateVal = new Date(+p[0], +p[1], +p[2])
            .toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
        } else if (dv) {
          dateVal = dv;
        }

        const rawProd = c[6]?.v ?? null;
        const rawUtil = c[7]?.v ?? null;
        const rawOcc  = c[8]?.v ?? null;
        const status  = (c[5]?.v || "").toString().trim().toLowerCase();

        return {
          Code:        (c[0]?.v ?? "").toString(),
          Name:         c[1]?.v || "",
          Account:      c[2]?.v || "",
          TeamLeader:   c[3]?.v || "",
          Date:         dateVal,
          Status:       status,
          Productivity: parsePercent(rawProd),
          Utilization:  parsePercent(rawUtil),
          Occupancy:    parsePercent(rawOcc),
          hasMetrics:   rawProd != null,
          Month:        c[9]?.v  || "",
          WeekMonth:    c[10]?.v || "",
          Week:         c[11]?.v || ""
        };
      });

      document.getElementById("loading").style.display   = "none";
      document.getElementById("dataTable").style.display = "table";

      populateFilters(fullData);
      applyFilters();

    } catch (err) {
      console.error("Load error:", err);
      document.getElementById("loading").innerText = "⚠️ Could not load data. See console for details.";
    }
  }

  /* ---------- FILTERS ---------- */
  function populateFilters(data) {
    const currentAccount   = document.getElementById("accountFilter").value;
    const currentMonth     = document.getElementById("monthFilter").value;
    const currentWeek      = document.getElementById("weekFilter").value;
    const currentWeekMonth = document.getElementById("weekMonthFilter").value;
    const currentDate      = document.getElementById("dateFilter").value;
    const currentCode      = document.getElementById("codeFilter").value;

    const uniqueAccounts   = [...new Set(fullData.map(x => x.Account))].filter(Boolean).sort();
    const uniqueMonths     = [...new Set(data.map(x => x.Month))].filter(Boolean).sort();
    const uniqueWeeks      = [...new Set(data.map(x => x.Week))].filter(Boolean).sort();
    const uniqueWeekMonths = [...new Set(data.map(x => x.WeekMonth))].filter(Boolean).sort();
    const uniqueDates      = [...new Set(data.map(x => x.Date))].filter(Boolean).sort();
    const uniqueCodes      = [...new Set(data.map(x => x.Code))].filter(Boolean).sort();

    const fill = (id, items, preserve) => {
      const el = document.getElementById(id);
      el.innerHTML = `<option value="All">All</option>`;
      items.forEach(v => {
        const selected = v === preserve ? ' selected' : '';
        el.innerHTML += `<option value="${v}"${selected}>${v}</option>`;
      });
      if (preserve !== "All" && !items.includes(preserve)) el.value = "All";
    };

    fill("accountFilter",   uniqueAccounts,   currentAccount);
    fill("monthFilter",     uniqueMonths,     currentMonth);
    fill("weekFilter",      uniqueWeeks,      currentWeek);
    fill("weekMonthFilter", uniqueWeekMonths, currentWeekMonth);
    fill("dateFilter",      uniqueDates,      currentDate);
    fill("codeFilter",      uniqueCodes,      currentCode);
  }

  function onAccountChange() {
    const account = document.getElementById("accountFilter").value;
    const scoped  = account === "All" ? fullData : fullData.filter(x => x.Account === account);
    populateFilters(scoped);
    applyFilters();
  }

  function onMonthChange() {
    const account = document.getElementById("accountFilter").value;
    const month   = document.getElementById("monthFilter").value;
    const scoped  = fullData.filter(x =>
      (account === "All" || x.Account === account) &&
      (month   === "All" || x.Month   === month)
    );
    populateFilters(scoped);
    applyFilters();
  }

  function onWeekChange() {
    const account = document.getElementById("accountFilter").value;
    const month   = document.getElementById("monthFilter").value;
    const week    = document.getElementById("weekFilter").value;
    const scoped  = fullData.filter(x =>
      (account === "All" || x.Account === account) &&
      (month   === "All" || x.Month   === month)   &&
      (week    === "All" || x.Week    === week)
    );
    populateFilters(scoped);
    applyFilters();
  }

  function onWeekMonthChange() {
    const account   = document.getElementById("accountFilter").value;
    const month     = document.getElementById("monthFilter").value;
    const week      = document.getElementById("weekFilter").value;
    const weekMonth = document.getElementById("weekMonthFilter").value;
    const scoped    = fullData.filter(x =>
      (account   === "All" || x.Account   === account)   &&
      (month     === "All" || x.Month     === month)     &&
      (week      === "All" || x.Week      === week)      &&
      (weekMonth === "All" || x.WeekMonth === weekMonth)
    );
    populateFilters(scoped);
    applyFilters();
  }

  /* ---------- APPLY FILTERS ---------- */
  function applyFilters() {
    const account   = document.getElementById("accountFilter").value;
    const month     = document.getElementById("monthFilter").value;
    const week      = document.getElementById("weekFilter").value;
    const weekMonth = document.getElementById("weekMonthFilter").value;
    const date      = document.getElementById("dateFilter").value;
    const code      = document.getElementById("codeFilter").value;

    filteredData = fullData.filter(row =>
      (account   === "All" || row.Account   === account)   &&
      (month     === "All" || row.Month     === month)     &&
      (week      === "All" || row.Week      === week)       &&
      (weekMonth === "All" || row.WeekMonth === weekMonth)  &&
      (date      === "All" || row.Date      === date)       &&
      (code      === "All" || row.Code      === code)
    );

    currentPage = 1;
    renderDashboard();
  }

  /* ---------- DASHBOARD ---------- */
  function renderDashboard() {
    const data = filteredData;

    const activeRows  = data.filter(x => !isLeave(x.Status));
    const totalActive = activeRows.length;

    const siteRows   = activeRows.filter(x => x.Status === "active - site").length;
    const remoteRows = activeRows.filter(x => x.Status === "active - remote").length;

    const onsiteRate = totalActive ? (siteRows   / totalActive) * 100 : 0;
    const remoteRate = totalActive ? (remoteRows / totalActive) * 100 : 0;

    const metricRows = data.filter(x => x.hasMetrics);
    const avg = key => metricRows.length
      ? metricRows.reduce((s, r) => s + (r[key] || 0), 0) / metricRows.length : 0;

    document.getElementById("onsiteRate").innerText      = onsiteRate.toFixed(1) + "%";
    document.getElementById("remoteRate").innerText      = remoteRate.toFixed(1) + "%";
    document.getElementById("avgProductivity").innerText = avg("Productivity").toFixed(1) + "%";
    document.getElementById("avgUtilization").innerText  = avg("Utilization").toFixed(1) + "%";
    document.getElementById("avgOccupancy").innerText    = avg("Occupancy").toFixed(1) + "%";

    renderChart(data);
    renderTable();
  }

  /* ---------- CHART ---------- */
  function renderChart(data) {
    const weeklyData = {};
    data.forEach(row => {
      const w = row.Week || "Unknown";
      if (!weeklyData[w]) weeklyData[w] = { site: new Set(), remote: new Set() };
      if (row.Status.includes("site"))   weeklyData[w].site.add(row.Code);
      if (row.Status.includes("remote")) weeklyData[w].remote.add(row.Code);
    });

    const labels       = Object.keys(weeklyData).sort();
    const siteCounts   = labels.map(w => weeklyData[w].site.size);
    const remoteCounts = labels.map(w => weeklyData[w].remote.size);

    if (weeklyChart) weeklyChart.destroy();
    weeklyChart = new Chart(document.getElementById("weeklyChart"), {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label: "Site",   data: siteCounts,   backgroundColor: "rgba(59,130,246,0.8)", borderColor: "rgba(59,130,246,1)", borderWidth: 1, borderRadius: 4 },
          { label: "Remote", data: remoteCounts, backgroundColor: "rgba(16,185,129,0.8)", borderColor: "rgba(16,185,129,1)", borderWidth: 1, borderRadius: 4 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: "top" }, tooltip: { mode: "index", intersect: false } },
        scales: { x: { stacked: false }, y: { beginAtZero: true, ticks: { stepSize: 1 } } }
      }
    });
  }

  /* ---------- TABLE (paginated) ---------- */
  function renderTable() {
    const tbody      = document.getElementById("tableBody");
    const pagination = document.getElementById("pagination");
    tbody.innerHTML  = "";

    if (filteredData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:24px;">No data found.</td></tr>`;
      pagination.style.display = "none";
      return;
    }

    const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
    const start      = (currentPage - 1) * PAGE_SIZE;
    const pageRows   = filteredData.slice(start, start + PAGE_SIZE);
    const fmt        = val => val != null ? val.toFixed(2) + "%" : "—";

    let html = "";
    pageRows.forEach(row => {
      const statusClass = row.Status.includes("site")   ? "status-site"
                        : row.Status.includes("remote") ? "status-remote"
                        : "status-other";
      html += `<tr>
        <td>${row.Code}</td>
        <td>${row.Name}</td>
        <td>${row.Account}</td>
        <td>${row.TeamLeader}</td>
        <td><span class="status-badge ${statusClass}">${row.Status}</span></td>
        <td>${row.Week}</td>
        <td>${fmt(row.Productivity)}</td>
        <td>${fmt(row.Utilization)}</td>
        <td>${fmt(row.Occupancy)}</td>
      </tr>`;
    });
    tbody.innerHTML = html;

    pagination.style.display = "flex";
    document.getElementById("pageInfo").innerText =
      `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, filteredData.length)} of ${filteredData.length} records`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;
  }

  function changePage(dir) {
    currentPage += dir;
    renderTable();
    window.scrollTo({ top: document.getElementById("dataTable").offsetTop - 20, behavior: "smooth" });
  }

  /* ---------- EVENTS ---------- */
  document.getElementById("accountFilter").addEventListener("change",   onAccountChange);
  document.getElementById("monthFilter").addEventListener("change",     onMonthChange);
  document.getElementById("weekFilter").addEventListener("change",      onWeekChange);
  document.getElementById("weekMonthFilter").addEventListener("change", onWeekMonthChange);
  document.getElementById("dateFilter").addEventListener("change",      applyFilters);
  document.getElementById("codeFilter").addEventListener("change",      applyFilters);

  loadData();
</script>

</body>
</html>
