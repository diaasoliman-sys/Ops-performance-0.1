<script>

const SHEET_ID = "1GfybYgbwlbIev0yxei_PW8pRNd7yRWhuwA-3ZNBfHp0";
const SHEET_NAME = "Attendance";

const URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let fullData = [];
let weeklyChart = null;

/* =========================
LOAD DATA
========================= */

async function loadData() {

  const response = await fetch(URL);
  const text = await response.text();

  const json = JSON.parse(text.substring(47).slice(0, -2));
  const rows = json.table.rows || [];

  fullData = rows.map(row => {
    const c = row.c || [];

    return {
      Code: c[0]?.v || "",
      Name: c[1]?.v || "",
      Account: c[2]?.v || "",
      TeamLeader: c[3]?.v || "",
      Date: c[4]?.v || "",
      Status: (c[5]?.v || "").toString().toLowerCase(),
      Productivity: parseFloat((c[6]?.v || 0).toString().replace("%", "")) || 0,
      Utilization: parseFloat((c[7]?.v || 0).toString().replace("%", "")) || 0,
      Occupancy: parseFloat((c[8]?.v || 0).toString().replace("%", "")) || 0,
      Month: c[9]?.v || "",
      WeekMonth: c[10]?.v || "",
      Week: c[11]?.v || ""
    };
  });

  populateFilters();
  renderDashboard();
}

/* =========================
FILTERS
========================= */

function populateFilters() {

  const codeFilter = document.getElementById("codeFilter");
  const weekFilter = document.getElementById("weekFilter");
  const accountFilter = document.getElementById("accountFilter");

  codeFilter.innerHTML = `<option value="All">All</option>`;
  weekFilter.innerHTML = `<option value="All">All</option>`;
  accountFilter.innerHTML = `<option value="All">All</option>`;

  const uniqueCodes = [...new Set(fullData.map(x => x.Code))].filter(Boolean);
  const uniqueWeeks = [...new Set(fullData.map(x => x.Week))].filter(Boolean);
  const uniqueAccounts = [...new Set(fullData.map(x => x.Account))].filter(Boolean);

  uniqueCodes.forEach(c =>
    codeFilter.innerHTML += `<option value="${c}">${c}</option>`
  );

  uniqueWeeks.forEach(w =>
    weekFilter.innerHTML += `<option value="${w}">${w}</option>`
  );

  uniqueAccounts.forEach(a =>
    accountFilter.innerHTML += `<option value="${a}">${a}</option>`
  );
}

/* =========================
FILTER DATA
========================= */

function getFilteredData() {

  const code = document.getElementById("codeFilter").value;
  const week = document.getElementById("weekFilter").value;
  const account = document.getElementById("accountFilter").value;

  return fullData.filter(row =>
    (code === "All" || row.Code == code) &&
    (week === "All" || row.Week == week) &&
    (account === "All" || row.Account == account)
  );
}

/* =========================
RENDER DASHBOARD
========================= */

function renderDashboard() {

  const data = getFilteredData();

  const uniqueEmployees = new Set(data.map(x => x.Code));
  const totalEmployees = uniqueEmployees.size;

  const onsiteEmployees = new Set(
    data.filter(x => x.Status.includes("site")).map(x => x.Code)
  );

  const remoteEmployees = new Set(
    data.filter(x => x.Status.includes("remote")).map(x => x.Code)
  );

  const onsiteRate = totalEmployees ? (onsiteEmployees.size / totalEmployees) * 100 : 0;
  const remoteRate = totalEmployees ? (remoteEmployees.size / totalEmployees) * 100 : 0;

  const avgProductivity = data.length
    ? data.reduce((s, r) => s + r.Productivity, 0) / data.length
    : 0;

  const avgUtilization = data.length
    ? data.reduce((s, r) => s + r.Utilization, 0) / data.length
    : 0;

  const avgOccupancy = data.length
    ? data.reduce((s, r) => s + r.Occupancy, 0) / data.length
    : 0;

  /* =========================
  UPDATE KPI
  ========================= */

  document.getElementById("employees").innerText = totalEmployees;
  document.getElementById("onsiteRate").innerText = onsiteRate.toFixed(1) + "%";
  document.getElementById("remoteRate").innerText = remoteRate.toFixed(1) + "%";
  document.getElementById("avgProductivity").innerText = avgProductivity.toFixed(1) + "%";
  document.getElementById("avgUtilization").innerText = avgUtilization.toFixed(1) + "%";
  document.getElementById("avgOccupancy").innerText = avgOccupancy.toFixed(1) + "%";

  /* =========================
  WEEKLY CHART
  ========================= */

  const weeklyData = {};

  data.forEach(row => {

    const week = row.Week || "Unknown";

    if (!weeklyData[week]) {
      weeklyData[week] = {
        site: new Set(),
        remote: new Set()
      };
    }

    if (row.Status.includes("site")) {
      weeklyData[week].site.add(row.Code);
    }

    if (row.Status.includes("remote")) {
      weeklyData[week].remote.add(row.Code);
    }
  });

  const labels = Object.keys(weeklyData);

  const siteCounts = labels.map(w => weeklyData[w].site.size);
  const remoteCounts = labels.map(w => weeklyData[w].remote.size);

  if (weeklyChart) weeklyChart.destroy();

  weeklyChart = new Chart(
    document.getElementById("weeklyChart"),
    {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label: "Site",
            data: siteCounts
          },
          {
            label: "Remote",
            data: remoteCounts
          }
        ]
      }
    }
  );

  /* =========================
  TABLE
  ========================= */

  const table = document.getElementById("tableBody");
  table.innerHTML = "";

  data.forEach(row => {
    table.innerHTML += `
      <tr>
        <td>${row.Code}</td>
        <td>${row.Name}</td>
        <td>${row.Account}</td>
        <td>${row.TeamLeader}</td>
        <td>${row.Status}</td>
        <td>${row.Week}</td>
        <td>${row.Productivity}%</td>
        <td>${row.Utilization}%</td>
        <td>${row.Occupancy}%</td>
      </tr>
    `;
  });
}

/* =========================
EVENTS
========================= */

document.getElementById("codeFilter").addEventListener("change", renderDashboard);
document.getElementById("weekFilter").addEventListener("change", renderDashboard);
document.getElementById("accountFilter").addEventListener("change", renderDashboard);

/* =========================
START
========================= */

loadData();

</script>
